<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>অ্যাডমিন — ফুড বক্স নালিতাবাড়ী</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8f1;--ink:#231a14;--muted:#7a6350;--b:#e8590c;--card:#fff;--line:#f3dfcf;--ok:#2b8a3e}
@media(prefers-color-scheme:dark){:root{--bg:#1c1713;--ink:#fff1e6;--muted:#d6bfae;--card:#2a221b;--line:#41352a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",sans-serif;line-height:1.55}
.w{max-width:760px;margin:0 auto;padding:14px 14px 80px}
h1{font-size:1.3rem;margin:0}h3{margin:0 0 6px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.btn{background:var(--b);color:#fff;border:0;border-radius:99px;padding:9px 18px;font:600 .95rem "Hind Siliguri",sans-serif;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tabs button{white-space:nowrap}
.tabs .on{background:var(--b);color:#fff;border-color:var(--b)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat b{display:block;font-size:1.35rem;color:var(--b)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.badge{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:600;background:var(--line)}
.badge.new{background:#ffe0cc;color:#a63d00}.badge.warn{background:#fff3cd;color:#5a4300}
small,.mut{color:var(--muted)}
a{color:var(--b)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;display:none;z-index:9}
label.ck{display:flex;gap:6px;align-items:center;font-size:.9rem}label.ck input{width:auto}
</style></head><body><div class="w" id="app"></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB=supabase.createClient("https://woutdhkqouyfakipotka.supabase.co","sb_publishable_OsfghOwXJr-FqQzCkov4HA_8xLSaeaV");
const $=id=>document.getElementById(id);
const esc=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]),tk=n=>"৳"+bn(n);
const ST={new:"নতুন",confirmed:"কনফার্ম",preparing:"তৈরি হচ্ছে",delivery:"ডেলিভারিতে",done:"সম্পন্ন",cancelled:"বাতিল"};
let tab="orders",stf="all",db={orders:[],items:[],coupons:[],reviews:[],areas:[],gallery:[]},known=-1,actx=null;
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2500)}
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[880,1175].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.2,actx.currentTime+i*.18);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+i*.18+.16);o.start(actx.currentTime+i*.18);o.stop(actx.currentTime+i*.18+.17)})}catch(e){}}
const dhaka=d=>new Date(d).toLocaleDateString("en-CA",{timeZone:"Asia/Dhaka"});
const fmtD=d=>new Date(d+"T00:00").toLocaleDateString("bn-BD",{day:"numeric",month:"long",weekday:"long"});

function login(msg){$("app").innerHTML=`<div class="card" style="margin-top:40px"><h1>অ্যাডমিন লগইন</h1><p class="mut">ফুড বক্স নালিতাবাড়ী</p>
 <label for="em">ইমেইল</label><input id="em" type="email" autocomplete="username">
 <label for="pw" style="display:block;margin-top:8px">পাসওয়ার্ড</label><input id="pw" type="password" autocomplete="current-password">
 <p style="color:#c92a2a;min-height:1.4em">${msg||""}</p><button class="btn" id="go" style="width:100%">লগইন</button></div>`;
 $("go").onclick=async()=>{beep();const {error}=await SB.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)return login("ইমেইল বা পাসওয়ার্ড ভুল");boot()};
 $("pw").onkeydown=e=>{if(e.key==="Enter")$("go").click()}}
async function boot(){const {data:{session}}=await SB.auth.getSession();if(!session)return login();
 const {data:ok}=await SB.rpc("is_admin");if(!ok){await SB.auth.signOut();return login("এই ইমেইল অ্যাডমিন তালিকায় নেই")}
 await loadAll();render();clearInterval(boot.t);boot.t=setInterval(poll,20000)}
async function loadAll(){const q=t=>SB.from(t).select("*");
 const [o,i,c,r,a,g]=await Promise.all([q("orders").order("created_at",{ascending:false}).limit(300),q("items").order("sort"),q("coupons"),q("reviews").order("created_at",{ascending:false}),q("delivery_areas").order("id"),q("gallery").order("sort")]);
 db={orders:o.data||[],items:i.data||[],coupons:c.data||[],reviews:r.data||[],areas:a.data||[],gallery:g.data||[]};known=db.orders.length}
async function poll(){const {count}=await SB.from("orders").select("*",{count:"exact",head:true});
 if(count!=null&&known>=0&&count>known){beep();toast("🔔 নতুন অর্ডার এসেছে!");await loadAll();if(tab==="orders"&&!document.activeElement.matches("input,textarea,select"))render()}}

function render(){const tabs=[["orders","অর্ডার"],["items","খাবার"],["coupons","কুপন"],["areas","ডেলিভারি"],["gallery","গ্যালারি"],["reviews","রিভিউ"]];
 const pend=db.reviews.filter(r=>!r.approved).length;
 $("app").innerHTML=`<div class="top"><h1>🍰 অ্যাডমিন প্যানেল</h1><span class="row"><a href="index.html" class="btn alt sm" style="text-decoration:none;color:inherit">সাইট</a><button class="btn alt sm" id="out">লগআউট</button></span></div>
 <div class="tabs">${tabs.map(([k,l])=>`<button class="btn alt sm ${tab===k?"on":""}" data-tab="${k}">${l}${k==="reviews"&&pend?` (${bn(pend)})`:""}</button>`).join("")}</div><div id="view">${({orders:vOrders,items:vItems,coupons:vCoupons,areas:vAreas,gallery:vGallery,reviews:vReviews})[tab]()}</div>`;
 $("out").onclick=async()=>{await SB.auth.signOut();login()}}

function vOrders(){const td=dhaka(Date.now()),live=db.orders.filter(o=>o.status!=="cancelled");
 const today=live.filter(o=>dhaka(o.created_at)===td);
 const st=`<div class="stats"><div class="stat">আজকের অর্ডার<b>${bn(today.length)}</b></div><div class="stat">আজকের বিক্রি<b>${tk(today.reduce((a,o)=>a+o.total,0))}</b></div><div class="stat">নতুন (দেখা বাকি)<b>${bn(db.orders.filter(o=>o.status==="new").length)}</b></div><div class="stat">অগ্রিম বাকি<b>${bn(live.filter(o=>o.first_order&&!o.advance_paid&&o.status!=="done").length)}</b></div></div>`;
 const chips=`<div class="tabs">${[["all","সব"],...Object.entries(ST)].map(([k,l])=>`<button class="btn alt sm ${stf===k?"on":""}" data-stf="${k}">${l}</button>`).join("")}</div>`;
 const list=db.orders.filter(o=>stf==="all"||o.status===stf).map(o=>{const ph="88"+o.phone;
 return `<div class="card" data-o="${o.id}"><div class="row" style="justify-content:space-between"><b>${esc(o.code)}</b><span class="badge ${o.status==="new"?"new":""}">${ST[o.status]}</span></div>
 <div>${esc(o.name)} · <a href="tel:${esc(o.phone)}">${bn(o.phone)}</a> · <a href="https://wa.me/${ph}" target="_blank" rel="noopener">WhatsApp</a></div>
 <div class="mut">${esc(o.area)}<br>${esc(o.address)}</div>
 <div>📅 ${fmtD(o.deliver_on)} · ${esc(o.slot)}</div>
 <ul style="margin:6px 0;padding-left:18px">${o.lines.map(l=>`<li>${esc(l.name)}${l.opt?` (${esc(l.opt)})`:""} × ${bn(l.qty)} ${esc(l.unit)}${l.free?` <small>(+${bn(l.free)} ফ্রি)</small>`:""}</li>`).join("")}</ul>
 ${o.cake_note?`<div>🎂 ${esc(o.cake_note)}</div>`:""}${o.note?`<div class="mut">নোট: ${esc(o.note)}</div>`:""}
 <div>খাবার ${tk(o.subtotal)}${o.discount?` − ছাড় ${tk(o.discount)} (${esc(o.coupon)})`:""} + ডেলিভারি ${tk(o.delivery_fee)} = <b>${tk(o.total)}</b> · ${esc(o.payment)}</div>
 <div class="row" style="margin-top:8px">${o.first_order?`<span class="badge warn">প্রথম অর্ডার</span><label class="ck"><input type="checkbox" data-adv="${o.id}" ${o.advance_paid?"checked":""}>অগ্রিম এসেছে</label>`:""}
 <select data-st="${o.id}" style="width:auto">${Object.entries(ST).map(([k,l])=>`<option value="${k}" ${o.status===k?"selected":""}>${l}</option>`).join("")}</select>
 <button class="btn alt sm" data-pr="${o.id}">মেমো প্রিন্ট</button></div>
 <small>${new Date(o.created_at).toLocaleString("bn-BD",{timeZone:"Asia/Dhaka"})}</small></div>`}).join("");
 return st+chips+(list||"<p class=mut>কোনো অর্ডার নেই।</p>")}

function itemCard(it){return `<div class="card" data-i="${it.id}"><input data-k="name" value="${esc(it.name)}" aria-label="নাম" placeholder="নাম">
 <div class="g2"><input data-k="category" value="${esc(it.category)}" aria-label="ক্যাটাগরি" placeholder="ক্যাটাগরি"><input data-k="unit" value="${esc(it.unit)}" aria-label="একক" placeholder="একক (পিস/পাউন্ড)"></div>
 <div class="g2"><input data-k="price" type="number" value="${it.price}" aria-label="দাম" placeholder="দাম"><input data-k="min_qty" type="number" value="${it.min_qty}" aria-label="সর্বনিম্ন" placeholder="সর্বনিম্ন পরিমাণ"></div>
 <div class="g2"><input data-k="free_per" type="number" value="${it.free_per}" aria-label="ফ্রি অফার" placeholder="কয় পিসে ১ ফ্রি (০ = নেই)"><input data-k="sort" type="number" value="${it.sort}" aria-label="ক্রম" placeholder="ক্রম"></div>
 <input data-k="description" value="${esc(it.description)}" aria-label="বর্ণনা" placeholder="বর্ণনা"><input data-k="options" value="${esc((it.options||[]).join(", "))}" aria-label="ধরন" placeholder="ধরন (কমা দিয়ে, যেমন: ঝাল, মিষ্টি)" style="margin-top:6px">
 ${/^https?:/.test(it.image_url||"")?`<img src="${esc(it.image_url)}" alt="" style="width:90px;height:70px;object-fit:cover;border-radius:10px;margin-top:6px">`:(it.image_url?`<small class="mut">ছবি: সাইটে বসানো আছে (${esc(it.image_url)})</small>`:"")}
 <label class="ck" style="margin-top:6px">ছবি: <input data-k="file" type="file" accept="image/*"></label>
 <div class="row" style="justify-content:space-between;margin-top:8px"><label class="ck"><input data-k="hidden" type="checkbox" ${it.hidden?"checked":""}>লুকানো (স্টক নেই)</label><span class="row"><button class="btn sm" data-save="${it.id}">সেভ</button><button class="btn alt sm" data-del="${it.id}">মুছুন</button></span></div></div>`}
const vItems=()=>`<button class="btn" data-newitem style="margin-bottom:10px">+ নতুন খাবার</button>`+db.items.map(itemCard).join("");
const vCoupons=()=>`<button class="btn" data-newc style="margin-bottom:10px">+ নতুন কুপন</button>`+db.coupons.map(c=>`<div class="card" data-c="${esc(c.code)}"><div class="g2"><input data-k="code" value="${esc(c.code)}" aria-label="কোড" disabled><select data-k="kind"><option value="pct" ${c.kind==="pct"?"selected":""}>শতাংশ %</option><option value="flat" ${c.kind==="flat"?"selected":""}>নির্দিষ্ট টাকা</option></select></div>
 <div class="g2"><input data-k="value" type="number" value="${c.value}" aria-label="ছাড়" placeholder="ছাড়"><input data-k="min_order" type="number" value="${c.min_order}" aria-label="ন্যূনতম অর্ডার" placeholder="ন্যূনতম অর্ডার"></div>
 <div class="row" style="justify-content:space-between"><label class="ck"><input data-k="active" type="checkbox" ${c.active?"checked":""}>চালু</label><span class="row"><button class="btn sm" data-savec="${esc(c.code)}">সেভ</button><button class="btn alt sm" data-delc="${esc(c.code)}">মুছুন</button></span></div></div>`).join("");
const vAreas=()=>`<p class="mut">ডেলিভারি চার্জ বদলাতে সংখ্যা বদলে বাইরে ক্লিক করুন।</p>`+db.areas.map(a=>`<div class="card row" style="justify-content:space-between" data-a="${a.id}"><span>${esc(a.union_name)} ইউনিয়ন${a.area_name==="পুরো ইউনিয়ন"?"":" — "+esc(a.area_name)}</span><span class="row"><input data-ch="${a.id}" type="number" value="${a.charge}" style="width:90px" aria-label="চার্জ"><label class="ck"><input data-act="${a.id}" type="checkbox" ${a.active?"checked":""}>চালু</label></span></div>`).join("");
const vReviews=()=>db.reviews.map(r=>`<div class="card"><b>${esc(r.name)}</b> ${"⭐".repeat(r.rating)} <span class="badge ${r.approved?"":"warn"}">${r.approved?"প্রকাশিত":"অপেক্ষায়"}</span><p style="margin:6px 0">${esc(r.body)}</p><span class="row">${r.approved?`<button class="btn alt sm" data-rv="${r.id}:0">লুকান</button>`:`<button class="btn sm" data-rv="${r.id}:1">অনুমোদন</button>`}<button class="btn alt sm" data-rdel="${r.id}">মুছুন</button></span></div>`).join("")||"<p class=mut>কোনো রিভিউ নেই।</p>";

async function mut(p,ok){const {error}=await p;if(error){toast("হয়নি: "+error.message);return false}toast(ok||"সেভ হয়েছে ✔");await loadAll();render();return true}
const vGallery=()=>`<label class="ck">নতুন ছবি যোগ করুন: <input type="file" accept="image/*" multiple id="galUp"></label><div class="g2" style="margin-top:10px">${db.gallery.map(g=>`<div class="card">${/^https?:/.test(g.url)?`<img src="${esc(g.url)}" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px">`:`<div class="mut" style="padding:20px 0;text-align:center">🖼️ ${esc(g.url)}</div>`}<button class="btn alt sm" data-delg="${g.id}" style="margin-top:6px;width:100%">মুছুন</button></div>`).join("")}</div>`;
function shrink(f,max=1000){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b||f),"image/jpeg",.82)};im.onerror=()=>res(f);im.src=URL.createObjectURL(f)})}
async function upImg(f){const b=await shrink(f);const path=Date.now()+"-"+Math.random().toString(36).slice(2,7)+".jpg";const up=await SB.storage.from("photos").upload(path,b,{contentType:"image/jpeg"});if(up.error)throw up.error;return SB.storage.from("photos").getPublicUrl(path).data.publicUrl}
function printOrder(o){const w=window.open("","_blank");if(!w)return toast("পপআপ অনুমতি দিন");
 w.document.write(`<html><head><meta charset="utf-8"><title>${o.code}</title><style>body{font-family:sans-serif;max-width:340px;margin:10px auto;font-size:14px}h2,p{text-align:center;margin:2px}table{width:100%;border-collapse:collapse}td{padding:2px 0}hr{border:0;border-top:1px dashed #000}</style></head><body><h2>ফুড বক্স নালিতাবাড়ী</h2><p>WhatsApp: ০১৯৮৪-৫১২৩৮৩</p><hr><p><b>${o.code}</b></p><p>${new Date(o.created_at).toLocaleString("bn-BD",{timeZone:"Asia/Dhaka"})}</p><hr>
 <p style="text-align:left">নাম: ${esc(o.name)}<br>ফোন: ${bn(o.phone)}<br>ঠিকানা: ${esc(o.area)}, ${esc(o.address)}<br>ডেলিভারি: ${fmtD(o.deliver_on)}, ${esc(o.slot)}</p><hr>
 <table>${o.lines.map(l=>`<tr><td>${esc(l.name)}${l.opt?` (${esc(l.opt)})`:""} × ${bn(l.qty)}${l.free?` +${bn(l.free)} ফ্রি`:""}</td><td align="right">${tk(l.price*l.qty)}</td></tr>`).join("")}</table><hr>
 <table><tr><td>খাবার</td><td align="right">${tk(o.subtotal)}</td></tr>${o.discount?`<tr><td>ছাড়</td><td align="right">−${tk(o.discount)}</td></tr>`:""}<tr><td>ডেলিভারি</td><td align="right">${tk(o.delivery_fee)}</td></tr><tr><td><b>মোট</b></td><td align="right"><b>${tk(o.total)}</b></td></tr></table>
 <p>পেমেন্ট: ${esc(o.payment)}${o.cake_note?"<br>কেক: "+esc(o.cake_note):""}</p><hr><p>ধন্যবাদ!</p><script>onload=()=>print()<\/script></body></html>`);w.document.close()}

document.addEventListener("click",async e=>{const t=e.target,d=t.dataset;if(!d)return;
 if(d.tab){tab=d.tab;return render()}
 if(d.stf){stf=d.stf;return render()}
 if(d.pr)return printOrder(db.orders.find(o=>o.id===d.pr));
 if(d.newitem)return mut(SB.from("items").insert({name:"নতুন খাবার",category:"অন্যান্য",price:100,unit:"পিস",sort:99}),"যোগ হয়েছে");
 if(d.del){if(confirm("এই খাবার মুছবেন?"))mut(SB.from("items").delete().eq("id",d.del),"মুছেছে");return}
 if(d.save){const b=document.querySelector(`[data-i="${d.save}"]`),g=k=>b.querySelector(`[data-k="${k}"]`);
  const opts=g("options").value.split(",").map(s=>s.trim()).filter(Boolean);
  const row={name:g("name").value.trim(),category:g("category").value.trim(),unit:g("unit").value.trim(),price:+g("price").value,min_qty:+g("min_qty").value||1,free_per:+g("free_per").value||0,sort:+g("sort").value||0,description:g("description").value.trim(),options:opts.length?opts:null,hidden:g("hidden").checked};
  const f=g("file").files[0];t.disabled=true;
  if(f){try{row.image_url=await upImg(f)}catch(x){t.disabled=false;return toast("ছবি আপলোড হয়নি: "+x.message)}}
  return mut(SB.from("items").update(row).eq("id",d.save))}
 if(d.delg){if(confirm("ছবিটা মুছবেন?"))mut(SB.from("gallery").delete().eq("id",d.delg),"মুছেছে");return}
 if(d.newc){const code=(prompt("কুপন কোড লিখুন (ইংরেজিতে)")||"").trim().toUpperCase();if(code)mut(SB.from("coupons").insert({code,kind:"pct",value:10,min_order:0}),"যোগ হয়েছে");return}
 if(d.delc){if(confirm("কুপন মুছবেন?"))mut(SB.from("coupons").delete().eq("code",d.delc),"মুছেছে");return}
 if(d.savec){const b=document.querySelector(`[data-c="${CSS.escape(d.savec)}"]`),g=k=>b.querySelector(`[data-k="${k}"]`);
  return mut(SB.from("coupons").update({kind:g("kind").value,value:+g("value").value,min_order:+g("min_order").value||0,active:g("active").checked}).eq("code",d.savec))}
 if(d.rv){const [id,v]=d.rv.split(":");return mut(SB.from("reviews").update({approved:v==="1"}).eq("id",id),"হয়েছে ✔")}
 if(d.rdel){if(confirm("রিভিউ মুছবেন?"))mut(SB.from("reviews").delete().eq("id",d.rdel),"মুছেছে");return}});
document.addEventListener("change",async e=>{const t=e.target,d=t.dataset;
 if(t.id==="galUp"&&t.files.length){toast("আপলোড হচ্ছে…");try{let n=db.gallery.length;for(const f of t.files){const url=await upImg(f);const {error}=await SB.from("gallery").insert({url,sort:++n});if(error)throw error}await loadAll();render();toast("ছবি যোগ হয়েছে ✔")}catch(x){toast("আপলোড হয়নি: "+x.message)}return}
 if(d.st)mut(SB.from("orders").update({status:t.value}).eq("id",d.st),"স্ট্যাটাস বদলেছে ✔");
 if(d.adv)mut(SB.from("orders").update({advance_paid:t.checked}).eq("id",d.adv),"আপডেট হয়েছে ✔");
 if(d.ch)mut(SB.from("delivery_areas").update({charge:+t.value}).eq("id",d.ch),"চার্জ বদলেছে ✔");
 if(d.act)mut(SB.from("delivery_areas").update({active:t.checked}).eq("id",d.act),"আপডেট হয়েছে ✔")});
boot();
</script></body></html>
